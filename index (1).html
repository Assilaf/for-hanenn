<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحنين 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4ee;--bg2:#ffd6e0;--card:rgba(255,255,255,.82);--ink:#6b2f3f;--hl:#d4506a;
  --soft:#ffc2cf;--b1:#d95c72;--b2:#ea7d5f;--shadow:rgba(224,110,120,.3);
  --f:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --fh:'Aref Ruqaa','Geeza Pro','Noto Naskh Arabic',serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2b1821;--bg2:#4b2536;--card:rgba(255,255,255,.09);--ink:#ffe8ee;--hl:#ff9fb2;--soft:#6e3a4d;--shadow:rgba(0,0,0,.45);color-scheme:dark}
}
:root[data-theme="dark"]{--bg1:#2b1821;--bg2:#4b2536;--card:rgba(255,255,255,.09);--ink:#ffe8ee;--hl:#ff9fb2;--soft:#6e3a4d;--shadow:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{position:relative;width:100%;max-width:428px;height:100%;max-height:926px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:26px;overflow:hidden}
@media (min-width:480px){
  body{display:flex;align-items:center;justify-content:center}
  .app{height:min(926px,100%);border-radius:44px;background:linear-gradient(160deg,var(--bg1),var(--bg2));box-shadow:0 30px 80px var(--shadow);outline:1px solid var(--soft)}
}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;color:var(--hl);opacity:0;animation:rise linear both}
.hearts .loop{animation-iteration-count:infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.4}100%{transform:translateY(-1000px) rotate(40deg);opacity:0}}
.dots{position:relative;z-index:1;display:flex;justify-content:center;gap:8px;padding-top:30px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--soft);transition:width .3s,background .3s}
.dots i.on{width:24px;background:var(--hl)}
.stage{position:relative;z-index:1;flex:1;display:grid;place-items:center;margin:0 16px}
.msg{grid-area:1/1;width:100%;display:flex;align-items:center;gap:14px;padding:24px 18px;background:var(--card);border-radius:32px;box-shadow:0 14px 40px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .45s,transform .45s,visibility .45s}
.msg.on{opacity:1;visibility:visible;transform:none}
.msg:nth-child(odd){--r:-5deg}
.msg:nth-child(even){--r:5deg}
.msg p{flex:1;margin:0;font-size:20px;line-height:1.9;font-weight:700}
.stk{width:150px;flex:none;height:auto;border:5px solid #fff;border-radius:22px;box-shadow:0 8px 20px var(--shadow);transform:rotate(var(--r))}
.msg.on .stk{animation:pop .7s .15s both cubic-bezier(.3,1.4,.5,1)}
.msg.on p{animation:rise-in .6s both}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(var(--r));opacity:1}}
@keyframes rise-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.last p{font-family:var(--fh);font-size:40px;line-height:1.6;color:var(--hl)}
#next{position:relative;z-index:1;margin:0 24px;padding:17px;border:0;border-radius:999px;font:700 19px/1 inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 10px 26px var(--shadow);cursor:pointer;transition:transform .15s}
#next:active{transform:scale(.97)}
#next:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hearts{display:none}}
</style>
</head>

<script>
(function(){
  var msgs=[].slice.call(document.querySelectorAll('.msg')),
      dots=document.getElementById('dots'),
      btn=document.getElementById('next'),
      field=document.getElementById('hearts'),
      sym=['♡','♥','✿'],i=0;
  msgs.forEach(function(){dots.appendChild(document.createElement('i'))});
  function heart(burst){
    var h=document.createElement('span'),d=burst?3+Math.random()*2:10+Math.random()*8;
    h.textContent=sym[Math.random()*3|0];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(14+Math.random()*22)+'px';
    h.style.animationDuration=d+'s';
    h.style.animationDelay=(burst?Math.random()*.8:Math.random()*10)+'s';
    if(burst){h.addEventListener('animationend',function(){h.remove()})}else{h.className='loop'}
    field.appendChild(h);
  }
  for(var k=0;k<9;k++)heart(false);
  function show(n){
    i=n;
    msgs.forEach(function(m,j){m.classList.toggle('on',j===n)});
    [].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j<=n)});
    var last=n===msgs.length-1;
    btn.textContent=last?'من البداية ↺':'متابعة ←';
    if(last)for(var k=0;k<18;k++)heart(true);
  }
  btn.addEventListener('click',function(){show(i===msgs.length-1?0:i+1)});
  show(0);
})();
</script>
</body>
</html>
